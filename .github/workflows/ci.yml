name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The build only needs env vars to be present and valid, not real:
      # `src/lib/env.ts` validates at import time and would otherwise fail.
      - name: Build
        run: npm run build
        env:
          CONATO_ACCESS_SECRET: ci-placeholder-secret-0123456789
          CONATO_COOKIE_SECRET: ci-placeholder-cookie-9876543210
          DATABASE_URL: postgresql://conato:conato@localhost:5432/conato
