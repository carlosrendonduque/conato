name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Ingest the demo corpus
        2. Open a file and select a paragraph
        3. Invoke "expand"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Running where
      options:
        - Local (docker compose)
        - Local (own PostgreSQL)
        - Vercel + Neon
        - Other host
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server output or browser console. **Redact API keys and secrets.**
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have not included any API key, token or secret in this report
          required: true
